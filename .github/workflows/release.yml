name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-latest
    env:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test tests/GlasLauncher.Core.Tests

      - name: Publish
        run: dotnet publish src/GlasLauncher.App -c Release -r win-x64 --self-contained -o publish

      - name: Install vpk
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Extract version and release notes from the tag
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          git tag -l --format='%(contents)' ${{ github.ref_name }} > release-notes.md

      - name: Download previous release (enables delta updates)
        run: vpk download github --repoUrl https://github.com/GotoKeiTai/Launcher-Qui-sonne-le-Glas---Project-Zomboid --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Pack
        run: vpk pack --packId GlasLauncher --packVersion $env:VERSION --packDir publish --mainExe GlasLauncher.App.exe --icon src/GlasLauncher.App/Assets/shield.ico --releaseNotes release-notes.md --outputDir Releases

      - name: Upload to GitHub Releases
        run: vpk upload github --repoUrl https://github.com/GotoKeiTai/Launcher-Qui-sonne-le-Glas---Project-Zomboid --token ${{ secrets.GITHUB_TOKEN }} --publish --outputDir Releases --releaseName "Glas Launcher $env:VERSION" --tag ${{ github.ref_name }}

      - name: Publish SHA-256 checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $hash = (Get-FileHash -Path "Releases\GlasLauncher-win-Setup.exe" -Algorithm SHA256).Hash
          "SHA256=$hash" >> $env:GITHUB_ENV
          Set-Content -Path "GlasLauncher-win-Setup.exe.sha256.txt" -Value "$hash  GlasLauncher-win-Setup.exe"
          gh release upload ${{ github.ref_name }} "GlasLauncher-win-Setup.exe.sha256.txt" --repo GotoKeiTai/Launcher-Qui-sonne-le-Glas---Project-Zomboid

      - name: Submit installer to VirusTotal
        if: ${{ env.VIRUSTOTAL_API_KEY != '' }}
        shell: pwsh
        run: |
          $headers = @{ "x-apikey" = $env:VIRUSTOTAL_API_KEY }
          $uploadUrlResponse = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Headers $headers -Method Get
          $uploadUrl = $uploadUrlResponse.data

          # Invoke-RestMethod's -Form parameter is unreliable for file uploads across
          # PowerShell versions ("Malformed multipart body") — build the multipart
          # request manually with HttpClient instead, the standard reliable approach.
          Add-Type -AssemblyName System.Net.Http
          $client = New-Object System.Net.Http.HttpClient
          $client.DefaultRequestHeaders.Add("x-apikey", $env:VIRUSTOTAL_API_KEY)
          $fileStream = [System.IO.File]::OpenRead("Releases\GlasLauncher-win-Setup.exe")
          try {
            $content = New-Object System.Net.Http.MultipartFormDataContent
            $fileContent = New-Object System.Net.Http.StreamContent($fileStream)
            $content.Add($fileContent, "file", "GlasLauncher-win-Setup.exe")
            $response = $client.PostAsync($uploadUrl, $content).GetAwaiter().GetResult()
            $response.EnsureSuccessStatusCode() | Out-Null
          }
          finally {
            $fileStream.Dispose()
            $client.Dispose()
          }

          $reportUrl = "https://www.virustotal.com/gui/file/$env:SHA256"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Rapport VirusTotal`n`nSoumis avec succes : $reportUrl`n`n(l'analyse prend quelques minutes a se completer avant que le rapport ne s'affiche)"
          Write-Output "Rapport VirusTotal : $reportUrl"

      - name: Release summary
        if: always()
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## SHA-256`n`n``$env:SHA256``"
